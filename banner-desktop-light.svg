<svg
  width="1200"
  height="240"
  viewBox="0 0 1200 240"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">
    Light animated GitHub banner matching the dark version layout and motion.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEAF7"/>
      <stop offset="52%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#E7EEF9"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#087F9F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="58%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2B5EA8"/>
    </linearGradient>

    <!-- Same moving ambient effect as dark mode, but stronger for light background -->
    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.26"/>
      <stop offset="42%" stop-color="#087F9F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#087F9F" stop-opacity="0"/>
    </radialGradient>

    <!-- Darker / more saturated dots so they remain visible in light mode -->
    <pattern id="dotPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#2E5D9E" opacity="0.72"/>
    </pattern>

    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="pointGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -1.2px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .role {
        font-size: 24px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .tagline {
        font-size: 18px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .code {
        font-size: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .chip {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base: same composition as dark mode -->
  <rect width="1200" height="240" rx="16" fill="url(#background)"/>
  <rect
    x="1"
    y="1"
    width="1198"
    height="238"
    rx="15"
    fill="none"
    stroke="#a7b2c1"
  />

  <!-- Ambient glow: moved away from the name toward upper-middle/right -->
  <g>
    <circle
      cx="865"
      cy="88"
      r="245"
      fill="url(#ambientGlow)"
      filter="url(#blurGlow)"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-22 16;0 0"
      keyTimes="0;0.5;1"
      dur="9s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </g>

  <!-- Same animated dot field, with enough contrast for light mode -->
  <rect
    x="430"
    y="12"
    width="720"
    height="214"
    fill="url(#dotPattern)"
    opacity="0.38"
  >
    <animate
      attributeName="opacity"
      values="0.32;0.54;0.32"
      keyTimes="0;0.5;1"
      dur="6s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </rect>

  <g filter="url(#pointGlow)">
  </g>

  <!-- Accent -->
  <rect
    x="46"
    y="42"
    width="6"
    height="156"
    rx="3"
    fill="url(#accentLine)"
  />

  <!-- Main text: identical positioning and animation -->
  <g opacity="0">
    <text x="82" y="90" class="name" fill="url(#nameGradient)">
      Ahmet Balci
    </text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      dur="1s"
      fill="freeze"
    />
  </g>

  <g opacity="0">
    <text x="84" y="134" class="role" fill="#087F9F">
      Fullstack Developer
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="1s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      begin="0.15s"
      dur="1s"
      fill="freeze"
    />
  </g>

  <g opacity="0">
    <text x="84" y="174" class="tagline" fill="#334155">
      Angular · TypeScript · Django · REST APIs
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      begin="0.3s"
      dur="1s"
      fill="freeze"
    />
  </g>

  <!-- Chips: same dark-mode shapes, light-mode colors -->
  <g opacity="0">
    <rect x="84" y="190" width="132" height="27" rx="13.5" fill="#D9EEF5" stroke="#4F8DA5"/>
    <text x="102" y="208" class="chip" fill="#075f78">ACCESSIBILITY</text>

    <rect x="226" y="190" width="94" height="27" rx="13.5" fill="#DFE9F7" stroke="#6D86B8"/>
    <text x="245" y="208" class="chip" fill="#315B9C">CLEAN UI</text>

    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="1s" fill="freeze"/>
  </g>

  <!-- Floating code panel: SAME dark-mode panel concept, only recolored -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -5;0 0"
      keyTimes="0;0.5;1"
      dur="7s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />

    <rect
      x="800"
      y="22"
      width="350"
      height="196"
      rx="13"
      fill="#CEDDEC"
      fill-opacity="0.72"
      stroke="#315F8D"
      stroke-opacity="0.42"
    />

    <text x="826" y="52" class="code" fill="#087F9F">const</text>
    <text x="870" y="52" class="code" fill="#3F536D">developer = {</text>

    <text x="826" y="82" class="code" fill="#3F536D">frontend:</text>
    <text x="907" y="82" class="code" fill="#2563EB">"Angular",</text>

    <text x="826" y="112" class="code" fill="#3F536D">backend:</text>
    <text x="897" y="112" class="code" fill="#2563EB">"Django",</text>

    <text x="826" y="142" class="code" fill="#3F536D">ci_cd:</text>
    <text x="884" y="142" class="code" fill="#2563EB">"GitHub Actions",</text>

    <text x="826" y="172" class="code" fill="#3F536D">deploy:</text>
    <text x="888" y="172" class="code" fill="#2563EB">"Docker · Linux"</text>

    <text x="826" y="202" class="code" fill="#3F536D">}</text>
  </g>
</svg>
