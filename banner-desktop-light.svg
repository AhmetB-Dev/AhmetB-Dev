<svg width="1200" height="240" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">Animated GitHub banner preserving Ahmet Balci's current portfolio design.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEAF7"/>
      <stop offset="52%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#E7EEF9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#087F9F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="58%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2B5EA8"/>
    </linearGradient>
    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".26"/>
      <stop offset="46%" stop-color="#087F9F" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#087F9F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#2E5D9E" opacity=".72"/>
    </pattern>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    
    <clipPath id="nameReveal">
      <rect x="48" y="38" width="0" height="66">
        <animate attributeName="width" from="0" to="520" dur=".78s" begin=".18s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
      </rect>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="800" y="22" width="350" height="196" rx="13"/>
    </clipPath>
    <style>
      .name { font-size:58px;font-weight:700;letter-spacing:-1.2px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .role { font-size:24px;font-weight:700;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { font-size:18px;font-weight:500;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .code { font-size:14px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { font-size:12px;font-weight:700;letter-spacing:.06em;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="238" rx="15" fill="none" stroke="#a7b2c1"/>

  

  <rect x="430" y="12" width="720" height="214" fill="url(#dotPattern)" opacity=".38">
    <animate attributeName="opacity" values=".32;.54;.32" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
<g clip-path="url(#nameReveal)">
    <text x="52" y="90" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
  </g>

  <g opacity="0">
    <text x="54" y="134" class="role" fill="#087F9F">Fullstack Developer</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.63s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.63s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>
  <g opacity="0">
    <text x="54" y="174" class="tagline" fill="#334155">Angular · TypeScript · Django · REST APIs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.78s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    
    <rect x="54" y="190" width="132" height="27" rx="13.5" fill="#D9EEF5" stroke="#4F8DA5"/>
    <text x="72" y="208" class="chip" fill="#075f78">ACCESSIBILITY</text>
    <rect x="196" y="190" width="94" height="27" rx="13.5" fill="#DFE9F7" stroke="#6D86B8"/>
    <text x="215" y="208" class="chip" fill="#315B9C">CLEAN UI</text>
  
    <animate attributeName="opacity" from="0" to="1" begin="0.92s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" begin="0.92s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    
    <animate attributeName="opacity" from="0" to="1" begin=".52s" dur=".55s" fill="freeze"/>
    <!-- One-time entrance: never resets to the right after the intro. -->
    <animateTransform attributeName="transform" type="translate" from="24 0" to="0 0" begin=".52s" dur=".75s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
    <g>
      <!-- After the intro, the code box only floats vertically in a seamless loop. -->
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 -4;0 0" keyTimes="0;.30;.72;1" begin="1.55s" dur="5.6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <rect x="800" y="22" width="350" height="196" rx="13"
      fill="#E8EDF4" fill-opacity=".78" stroke="#6F8299" stroke-opacity=".36"/>
    <text x="826" y="52" class="code" fill="#087F9F">const</text>
    <text x="870" y="52" class="code" fill="#3F536D">developer = &#123;</text>

    <text x="826" y="82" class="code" fill="#3F536D">frontend:</text>
    <text x="907" y="82" class="code" fill="#2563EB">"Angular",</text>

    <text x="826" y="112" class="code" fill="#3F536D">backend:</text>
    <text x="897" y="112" class="code" fill="#2563EB">"Django",</text>

    <text x="826" y="142" class="code" fill="#3F536D">ci_cd:</text>
    <text x="884" y="142" class="code" fill="#2563EB">"GitHub Actions",</text>

    <text x="826" y="172" class="code" fill="#3F536D">deploy:</text>
    <text x="888" y="172" class="code" fill="#2563EB">"Docker · Linux"</text>

    <text x="826" y="202" class="code" fill="#3F536D">&#125;</text>
    </g>
  </g>
</svg>