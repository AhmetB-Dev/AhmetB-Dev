<svg width="540" height="420" viewBox="0 0 540 420"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img" aria-labelledby="title description">
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">Light mobile animated GitHub profile banner matching the dark version.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEAF7"/>
      <stop offset="54%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#E7EEF9"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#087F9F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="62%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2B5EA8"/>
    </linearGradient>

    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.26"/>
      <stop offset="46%" stop-color="#087F9F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#087F9F" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#2E5D9E" opacity="0.73"/>
    </pattern>

    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="pointGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -1px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .role {
        font-size: 27px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .tagline {
        font-size: 19px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .chip {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .06em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .code {
        font-size: 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <rect width="540" height="420" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="538" height="418" rx="19"
    fill="none" stroke="#a7b2c1"/>

  <!-- Glow moved away from name -->
  <g>
    <circle cx="390" cy="175" r="205"
      fill="url(#ambientGlow)" filter="url(#blurGlow)"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-18 14;0 0" keyTimes="0;0.5;1"
      dur="9s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>

  <rect x="180" y="12" width="340" height="390"
    fill="url(#dotPattern)" opacity="0.39">
    <animate attributeName="opacity"
      values="0.33;0.55;0.33" keyTimes="0;0.5;1"
      dur="6s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <g filter="url(#pointGlow)">
  </g>

  <rect x="30" y="35" width="6" height="190" rx="3"
    fill="url(#accentLine)"/>

  <g opacity="0">
    <text x="58" y="92" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="60" y="137" class="role" fill="#087F9F">Fullstack Developer</text>
    <animate attributeName="opacity" from="0" to="1"
      begin=".15s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" begin=".15s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="60" y="178" class="tagline" fill="#334155">Angular · TypeScript · Django · REST APIs</text>
    <animate attributeName="opacity" from="0" to="1"
      begin=".3s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <rect x="60" y="205" width="145" height="32" rx="16"
      fill="#D9EEF5" stroke="#4F8DA5"/>
    <text x="81" y="226" class="chip" fill="#075f78">ACCESSIBILITY</text>

    <rect x="216" y="205" width="108" height="32" rx="16"
      fill="#DFE9F7" stroke="#6D86B8"/>
    <text x="238" y="226" class="chip" fill="#315B9C">CLEAN UI</text>

    <animate attributeName="opacity" from="0" to="1"
      begin=".45s" dur="1s" fill="freeze"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" keyTimes="0;0.5;1"
      dur="7s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>

    <!-- Same as dark card, only light-tinted -->
    <rect x="30" y="262" width="480" height="138" rx="14"
      fill="#CEDDEC" fill-opacity=".76"
      stroke="#315F8D" stroke-opacity=".44"/>

    <text x="52" y="292" class="code" fill="#3F536D">frontend:</text>
    <text x="148" y="292" class="code" fill="#2563EB">Angular</text>

    <text x="52" y="322" class="code" fill="#3F536D">backend:</text>
    <text x="139" y="322" class="code" fill="#2563EB">Django</text>

    <text x="52" y="352" class="code" fill="#3F536D">ci_cd:</text>
    <text x="121" y="352" class="code" fill="#2563EB">GitHub Actions</text>

    <text x="52" y="382" class="code" fill="#3F536D">deploy:</text>
    <text x="130" y="382" class="code" fill="#2563EB">Docker · Linux</text>
  </g>
</svg>
