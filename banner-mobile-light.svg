<svg width="540" height="420" viewBox="0 0 540 420" preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">Animated mobile GitHub profile banner preserving the current design.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEAF7"/>
      <stop offset="54%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#E7EEF9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#087F9F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="62%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2B5EA8"/>
    </linearGradient>
    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".32"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#2E5D9E" opacity=".73"/>
    </pattern>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="nameReveal">
      <rect x="30" y="40" width="0" height="66"><animate attributeName="width" from="0" to="440" dur=".78s" begin=".18s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/></rect>
    </clipPath>
    <style>
      .name {font-size:54px;font-weight:700;letter-spacing:-1px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .role {font-size:27px;font-weight:700;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .tagline {font-size:19px;font-weight:500;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .chip {font-size:13px;font-weight:700;letter-spacing:.06em;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .code {font-size:18px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
    </style>
  </defs>

  <rect width="540" height="420" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="538" height="418" rx="19" fill="none" stroke="#a7b2c1"/>

  

  <rect x="180" y="12" width="340" height="390" fill="url(#dotPattern)" opacity=".39">
    <animate attributeName="opacity" values=".33;.55;.33" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
<g clip-path="url(#nameReveal)">
    <text x="32" y="92" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
  </g>

  <g opacity="0">
    <text x="34" y="137" class="role" fill="#087F9F">Fullstack Developer</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.63s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.63s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>
  <g opacity="0">
    <text x="34" y="178" class="tagline" fill="#334155">Angular · TypeScript · Django · REST APIs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.78s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    
    <rect x="34" y="205" width="145" height="32" rx="16" fill="#D9EEF5" stroke="#4F8DA5"/>
    <text x="55" y="226" class="chip" fill="#075f78">ACCESSIBILITY</text>
    <rect x="190" y="205" width="108" height="32" rx="16" fill="#DFE9F7" stroke="#6D86B8"/>
    <text x="212" y="226" class="chip" fill="#315B9C">CLEAN UI</text>
  
    <animate attributeName="opacity" from="0" to="1" begin="0.92s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.92s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".58s" dur=".55s" fill="freeze"/>
    <!-- One-time entrance: the intro movement never restarts. -->
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin=".58s" dur=".75s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
    <g>
      <!-- After the intro, the code box only floats vertically in a seamless loop. -->
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 -4;0 0" keyTimes="0;.30;.72;1" begin="1.55s" dur="5.6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <rect x="30" y="262" width="480" height="138" rx="14"
      fill="#E8EDF4" fill-opacity=".80" stroke="#6F8299" stroke-opacity=".36"/>
    <text x="52" y="292" class="code" fill="#3F536D">frontend:</text>
    <text x="148" y="292" class="code" fill="#2563EB">Angular</text>

    <text x="52" y="322" class="code" fill="#3F536D">backend:</text>
    <text x="139" y="322" class="code" fill="#2563EB">Django</text>

    <text x="52" y="352" class="code" fill="#3F536D">ci_cd:</text>
    <text x="121" y="352" class="code" fill="#2563EB">GitHub Actions</text>

    <text x="52" y="382" class="code" fill="#3F536D">deploy:</text>
    <text x="130" y="382" class="code" fill="#2563EB">Docker · Linux</text>
    </g>
  </g>
</svg>