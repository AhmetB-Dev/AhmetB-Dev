<svg
  width="480"
  height="470"
  viewBox="0 0 480 470"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ahmet Balci – Frontend Developer</title>
  <desc id="description">
    Mobile version of the animated GitHub banner with readable text and compact code elements.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="58%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9382ff"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#315cff" stop-opacity="0.30"/>
      <stop offset="46%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4f8cff" opacity="0.58"/>
    </pattern>

    <pattern id="dotsSparse" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#38bdf8" opacity="0.48"/>
      <circle cx="26" cy="18" r="1.05" fill="#8b5cf6" opacity="0.36"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="pointGlow" x="-500%" y="-500%" width="1000%" height="1000%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -1px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .role {
        font-size: 25px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .tagline {
        font-size: 18px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .code {
        font-size: 17px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .chip {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <rect width="480" height="470" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="478" height="468" rx="19" fill="none" stroke="#30363d"/>

  <g>
    <circle cx="418" cy="45" r="180"
      fill="url(#ambientGlow)" filter="url(#softGlow)"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-15 12;0 0"
      keyTimes="0;0.5;1"
      dur="9s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>

  <rect x="125" y="10" width="340" height="440"
    fill="url(#dots)" opacity="0.34">
    <animate attributeName="opacity"
      values="0.26;0.46;0.26"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

  <rect x="180" y="18" width="285" height="420"
    fill="url(#dotsSparse)" opacity="0.27">
    <animate attributeName="opacity"
      values="0.18;0.36;0.18"
      dur="7.5s"
      begin="-2s"
      repeatCount="indefinite"/>
  </rect>

  <g filter="url(#pointGlow)">
    <circle cx="265" cy="75" r="2.2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2"
        dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="402" cy="185" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.2;0.95;0.2"
        dur="5.2s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="382" r="2" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.2;0.9;0.2"
        dur="4.8s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke-linecap="round">
    <path
      d="M160 450 C240 390 315 392 370 350 C420 312 450 235 480 120"
      stroke="#2563eb"
      stroke-opacity="0.50"
      stroke-width="2"/>
    <path
      d="M210 470 C290 410 345 416 398 370 C445 330 466 254 480 166"
      stroke="#8b5cf6"
      stroke-opacity="0.46"
      stroke-width="2"/>
    <path
      d="M320 470 C385 430 428 405 452 350 C470 306 477 220 480 76"
      stroke="#38bdf8"
      stroke-opacity="0.27"
      stroke-width="1.4"/>
  </g>

  <rect x="28" y="32" width="6" height="205" rx="3" fill="url(#accentLine)"/>

  <g opacity="0">
    <text x="52" y="88" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="54" y="132" class="role" fill="#38bdf8">Frontend Developer</text>
    <animate attributeName="opacity" from="0" to="1" begin=".15s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" begin=".15s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="54" y="172" class="tagline" fill="#e5e7eb">Angular · TypeScript</text>
    <text x="54" y="202" class="tagline" fill="#e5e7eb">Accessible Interfaces</text>
    <animate attributeName="opacity" from="0" to="1" begin=".3s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <rect x="54" y="222" width="132" height="30" rx="15"
      fill="#101827" stroke="#245b73"/>
    <text x="72" y="242" class="chip" fill="#7dd3fc">ACCESSIBILITY</text>

    <rect x="196" y="222" width="98" height="30" rx="15"
      fill="#151124" stroke="#5c3b82"/>
    <text x="216" y="242" class="chip" fill="#c084fc">CLEAN UI</text>

    <animate attributeName="opacity" from="0" to="1" begin=".45s" dur="1s" fill="freeze"/>
  </g>

  <!-- Mobile code window -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -4;0 0"
      keyTimes="0;0.5;1"
      dur="7s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>

    <rect x="34" y="286" width="282" height="136" rx="15"
      fill="#080c18" fill-opacity="0.62"
      stroke="#58a6ff" stroke-opacity="0.30"/>

    <line x1="34" y1="320" x2="316" y2="320"
      stroke="#58a6ff" stroke-opacity="0.20"/>

    <circle cx="57" cy="303" r="4.2" fill="#c9d1d9"/>
    <circle cx="74" cy="303" r="4.2" fill="#c9d1d9"/>
    <circle cx="91" cy="303" r="4.2" fill="#c9d1d9"/>

    <text x="58" y="350" class="code" fill="#38bdf8">&lt;app-root&gt;</text>
    <text x="76" y="378" class="code" fill="#7dd3fc">&lt;header /&gt;</text>
    <text x="76" y="406" class="code" fill="#a855f7">&lt;main /&gt;</text>
  </g>

  <!-- Mobile smaller icon card -->
  <g>
    <rect x="344" y="312" width="88" height="76" rx="14"
      fill="#080c18" fill-opacity="0.76"
      stroke="#38bdf8" stroke-opacity="0.56"/>
    <text x="360" y="361"
      font-size="32"
      font-weight="700"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      fill="#7dd3fc">&lt;/&gt;</text>
  </g>
</svg>