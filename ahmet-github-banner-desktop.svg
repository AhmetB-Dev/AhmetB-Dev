<svg
  width="1200"
  height="240"
  viewBox="0 0 1200 240"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ahmet Balci – Frontend Developer</title>
  <desc id="description">
    Dark animated GitHub banner focused on Angular, TypeScript,
    accessibility and clean user interfaces.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="52%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b8cff"/>
    </linearGradient>

    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="46%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#4f8cff" opacity="0.42"/>
    </pattern>

    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="pointGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -1.2px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .role {
        font-size: 24px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .tagline {
        font-size: 18px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .code {
        font-size: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .chip {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base -->
  <rect width="1200" height="240" rx="16" fill="url(#background)"/>
  <rect
    x="1"
    y="1"
    width="1198"
    height="238"
    rx="15"
    fill="none"
    stroke="#30363d"
  />

  <!-- Ambient glow -->
  <g>
    <circle
      cx="1035"
      cy="35"
      r="225"
      fill="url(#ambientGlow)"
      filter="url(#blurGlow)"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-22 16;0 0"
      keyTimes="0;0.5;1"
      dur="9s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </g>

  <!-- Animated star-like dot field -->
  <rect
    x="430"
    y="12"
    width="720"
    height="214"
    fill="url(#dotPattern)"
    opacity="0.20"
  >
    <animate
      attributeName="opacity"
      values="0.18;0.34;0.18"
      keyTimes="0;0.5;1"
      dur="6s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </rect>

  <!-- A few brighter points -->
  <g filter="url(#pointGlow)">
    <circle cx="570" cy="55" r="2.2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="4.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="164" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.2s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="790" cy="84" r="1.8" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.18;0.85;0.18" dur="4.8s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="190" r="2.1" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.6s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Accent -->
  <rect
    x="46"
    y="42"
    width="6"
    height="156"
    rx="3"
    fill="url(#accentLine)"
  />

  <!-- Main text -->
  <g opacity="0">
    <text x="82" y="90" class="name" fill="url(#nameGradient)">
      Ahmet Balci
    </text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      dur="1s"
      fill="freeze"
    />
  </g>

  <g opacity="0">
    <text x="84" y="134" class="role" fill="#38bdf8">
      Frontend Developer
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="1s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      begin="0.15s"
      dur="1s"
      fill="freeze"
    />
  </g>

  <g opacity="0">
    <text x="84" y="174" class="tagline" fill="#e5e7eb">
      Angular · TypeScript · Accessible Interfaces
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      begin="0.3s"
      dur="1s"
      fill="freeze"
    />
  </g>

  <!-- Small positioning chips -->
  <g opacity="0">
    <rect x="84" y="190" width="132" height="27" rx="13.5" fill="#101827" stroke="#245b73"/>
    <text x="102" y="208" class="chip" fill="#7dd3fc">ACCESSIBILITY</text>

    <rect x="226" y="190" width="94" height="27" rx="13.5" fill="#151124" stroke="#5c3b82"/>
    <text x="245" y="208" class="chip" fill="#c084fc">CLEAN UI</text>

    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="1s" fill="freeze"/>
  </g>

  <!-- Floating code panel -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -5;0 0"
      keyTimes="0;0.5;1"
      dur="7s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />

    <rect
      x="820"
      y="34"
      width="330"
      height="172"
      rx="13"
      fill="#080c18"
      fill-opacity="0.56"
      stroke="#58a6ff"
      stroke-opacity="0.16"
    />

    <text x="846" y="67" class="code" fill="#38bdf8">const</text>
    <text x="890" y="67" class="code" fill="#7c8dbb">developer = {</text>

    <text x="846" y="96" class="code" fill="#7c8dbb">stack:</text>
    <text x="905" y="96" class="code" fill="#a855f7">["Angular", "TypeScript"],</text>

    <text x="846" y="125" class="code" fill="#7c8dbb">focus:</text>
    <text x="905" y="125" class="code" fill="#a855f7">["Accessibility", "Clean UI"],</text>

    <text x="846" y="154" class="code" fill="#7c8dbb">learning:</text>
    <text x="925" y="154" class="code" fill="#a855f7">["Node.js", "Django"],</text>

    <text x="846" y="183" class="code" fill="#7c8dbb">goal:</text>
    <text x="893" y="183" class="code" fill="#a855f7">"Fullstack"</text>
  </g>
</svg>