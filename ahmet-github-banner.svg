<svg
  width="1200"
  height="240"
  viewBox="0 0 1200 240"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ahmet Balci – Frontend Developer</title>
  <desc id="description">
    Animated dark GitHub profile banner with subtle star-like dots and code panel.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="58%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="64%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#4f8cff" opacity="0.42"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <style>
      .name {
        font-size: 58px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        letter-spacing: -1.2px;
      }

      .role {
        font-size: 24px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .tagline {
        font-size: 18px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .code {
        font-size: 15px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#background)"/>
  <rect
    x="1"
    y="1"
    width="1198"
    height="238"
    rx="15"
    fill="none"
    stroke="#30363d"
  />

  <!-- Slowly moving ambient glow -->
  <g>
    <circle
      cx="1040"
      cy="38"
      r="235"
      fill="url(#glow)"
      filter="url(#softGlow)"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      dur="8s"
      repeatCount="indefinite"
      values="0 0;-26 18;0 0"
      keyTimes="0;0.5;1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </g>

  <!-- Star-like dotted field -->
  <rect
    x="460"
    y="12"
    width="700"
    height="214"
    fill="url(#dots)"
    opacity="0.20"
  >
    <animate
      attributeName="opacity"
      values="0.18;0.38;0.18"
      keyTimes="0;0.5;1"
      dur="5s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </rect>

  <!-- Accent line -->
  <rect
    x="46"
    y="43"
    width="6"
    height="154"
    rx="3"
    fill="url(#accent)"
  />

  <!-- Main text -->
  <g opacity="0">
    <text x="82" y="91" class="name" fill="url(#nameGradient)">
      Ahmet Balci
    </text>
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="1.1s"
      fill="freeze"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      dur="1.1s"
      fill="freeze"
    />
  </g>

  <g opacity="0">
    <text x="84" y="135" class="role" fill="#38bdf8">
      Frontend Developer
    </text>
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.15s"
      dur="1.1s"
      fill="freeze"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      begin="0.15s"
      dur="1.1s"
      fill="freeze"
    />
  </g>

  <g opacity="0">
    <text x="84" y="177" class="tagline" fill="#e5e7eb">
      Angular · TypeScript · Accessible Web Applications
    </text>
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="0.3s"
      dur="1.1s"
      fill="freeze"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 5;0 0"
      begin="0.3s"
      dur="1.1s"
      fill="freeze"
    />
  </g>

  <!-- Floating code panel -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -6;0 0"
      keyTimes="0;0.5;1"
      dur="6s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />

    <rect
      x="830"
      y="39"
      width="320"
      height="162"
      rx="13"
      fill="#080c18"
      fill-opacity="0.52"
      stroke="#58a6ff"
      stroke-opacity="0.15"
    />

    <text x="856" y="75" class="code" fill="#38bdf8">const</text>
    <text x="900" y="75" class="code" fill="#7c8dbb">developer = {</text>

    <text x="856" y="108" class="code" fill="#7c8dbb">focus:</text>
    <text x="916" y="108" class="code" fill="#a855f7">"Frontend",</text>

    <text x="856" y="141" class="code" fill="#7c8dbb">learning:</text>
    <text x="938" y="141" class="code" fill="#a855f7">["Node.js", "Python",</text>
    <text x="938" y="164" class="code" fill="#a855f7">"Django"],</text>

    <text x="856" y="190" class="code" fill="#7c8dbb">goal:</text>
    <text x="904" y="190" class="code" fill="#a855f7">"Fullstack"</text>
  </g>
</svg>
