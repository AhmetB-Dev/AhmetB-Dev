<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ahmet Balci – Frontend Developer</title>
  <desc id="description">
    Dark animated GitHub banner with glowing dots, curved lines and a code window.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="58%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9382ff"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#315cff" stop-opacity="0.30"/>
      <stop offset="46%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#4f8cff" opacity="0.42"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="pointGlow" x="-500%" y="-500%" width="1000%" height="1000%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-size: 60px;
        font-weight: 700;
        letter-spacing: -1.4px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .role {
        font-size: 25px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .tagline {
        font-size: 18px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .code {
        font-size: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .chip {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#30363d"/>

  <!-- Ambient glow -->
  <g>
    <circle
      cx="1030"
      cy="36"
      r="250"
      fill="url(#ambientGlow)"
      filter="url(#softGlow)"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-22 15;0 0"
      keyTimes="0;0.5;1"
      dur="9s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </g>

  <!-- Dotted background -->
  <rect
    x="430"
    y="14"
    width="735"
    height="266"
    fill="url(#dots)"
    opacity="0.20"
  >
    <animate
      attributeName="opacity"
      values="0.16;0.34;0.16"
      keyTimes="0;0.5;1"
      dur="6s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />
  </rect>

  <!-- Brighter points -->
  <g filter="url(#pointGlow)">
    <circle cx="560" cy="78" r="2.2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="188" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="5.2s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="925" cy="92" r="1.9" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.8s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="214" r="2.1" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.6s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Curved background lines -->
  <g fill="none" stroke-linecap="round">
    <path
      d="M520 258 C660 180 745 180 865 226 C970 266 1065 255 1200 158"
      stroke="#2563eb"
      stroke-opacity="0.48"
      stroke-width="2"
    >
      <animate
        attributeName="stroke-opacity"
        values="0.26;0.62;0.26"
        dur="7s"
        repeatCount="indefinite"
      />
    </path>

    <path
      d="M585 282 C720 200 820 210 918 246 C1030 288 1110 246 1200 184"
      stroke="#8b5cf6"
      stroke-opacity="0.46"
      stroke-width="2"
    >
      <animate
        attributeName="stroke-opacity"
        values="0.22;0.58;0.22"
        dur="8.5s"
        begin="-2s"
        repeatCount="indefinite"
      />
    </path>

    <path
      d="M850 300 C950 230 1030 236 1200 122"
      stroke="#38bdf8"
      stroke-opacity="0.24"
      stroke-width="1.5"
    />
  </g>

  <!-- Left accent -->
  <rect x="43" y="46" width="6" height="190" rx="3" fill="url(#accentLine)"/>

  <!-- Main text -->
  <g opacity="0">
    <text x="78" y="104" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="80" y="148" class="role" fill="#38bdf8">Frontend Developer</text>
    <animate attributeName="opacity" from="0" to="1" begin=".15s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" begin=".15s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="80" y="192" class="tagline" fill="#e5e7eb">
      Angular · TypeScript · Accessible Interfaces
    </text>
    <animate attributeName="opacity" from="0" to="1" begin=".3s" dur="1s" fill="freeze"/>
  </g>

  <!-- Positioning chips -->
  <g opacity="0">
    <rect x="80" y="214" width="133" height="29" rx="14.5"
      fill="#101827" stroke="#245b73"/>
    <text x="98" y="233" class="chip" fill="#7dd3fc">ACCESSIBILITY</text>

    <rect x="224" y="214" width="98" height="29" rx="14.5"
      fill="#151124" stroke="#5c3b82"/>
    <text x="244" y="233" class="chip" fill="#c084fc">CLEAN UI</text>

    <animate attributeName="opacity" from="0" to="1" begin=".45s" dur="1s" fill="freeze"/>
  </g>

  <!-- Code window -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -5;0 0"
      keyTimes="0;0.5;1"
      dur="7s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
    />

    <rect x="790" y="40" width="330" height="180" rx="15"
      fill="#080c18" fill-opacity="0.60"
      stroke="#58a6ff" stroke-opacity="0.28"/>

    <line x1="790" y1="78" x2="1120" y2="78"
      stroke="#58a6ff" stroke-opacity="0.20"/>

    <circle cx="818" cy="60" r="5" fill="#c9d1d9"/>
    <circle cx="838" cy="60" r="5" fill="#c9d1d9"/>
    <circle cx="858" cy="60" r="5" fill="#c9d1d9"/>

    <text x="820" y="111" class="code" fill="#38bdf8">&lt;app-root&gt;</text>
    <text x="842" y="140" class="code" fill="#7dd3fc">&lt;header /&gt;</text>
    <text x="842" y="169" class="code" fill="#a855f7">&lt;main /&gt;</text>
    <text x="842" y="198" class="code" fill="#f472b6">&lt;footer /&gt;</text>
  </g>

  <!-- Code icon card -->
  <g>
    <rect x="1042" y="181" width="118" height="86" rx="16"
      fill="#080c18" fill-opacity="0.74"
      stroke="#38bdf8" stroke-opacity="0.58"/>
    <text x="1067" y="237"
      font-size="46"
      font-weight="700"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      fill="#7dd3fc">&lt;/&gt;</text>
  </g>
</svg>