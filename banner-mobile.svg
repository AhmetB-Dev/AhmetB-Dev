<svg width="540" height="420" viewBox="0 0 540 420"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  role="img" aria-labelledby="title description">
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">Mobile animated GitHub profile banner.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="54%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b8cff"/>
    </linearGradient>

    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#4f8cff" opacity="0.45"/>
    </pattern>

    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="pointGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -1px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .role {
        font-size: 27px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .tagline {
        font-size: 19px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .chip {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .06em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .code {
        font-size: 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <rect width="540" height="420" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="538" height="418" rx="19"
    fill="none" stroke="#30363d"/>

  <g>
    <circle cx="465" cy="48" r="190"
      fill="url(#ambientGlow)" filter="url(#blurGlow)"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-18 14;0 0" keyTimes="0;0.5;1"
      dur="9s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>

  <rect x="180" y="12" width="340" height="390"
    fill="url(#dotPattern)" opacity="0.20">
    <animate attributeName="opacity"
      values="0.18;0.35;0.18" keyTimes="0;0.5;1"
      dur="6s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <g filter="url(#pointGlow)">
  </g>

  <rect x="30" y="35" width="6" height="190" rx="3"
    fill="url(#accentLine)"/>

  <g opacity="0">
    <text x="58" y="92" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="60" y="137" class="role" fill="#38bdf8">Fullstack Developer</text>
    <animate attributeName="opacity" from="0" to="1"
      begin=".15s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 6;0 0" begin=".15s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="60" y="178" class="tagline" fill="#e5e7eb">Angular · TypeScript · Django · REST</text>
    <text x="60" y="206" class="tagline" fill="#e5e7eb">Accessible Interfaces · Clean UI</text>
    <animate attributeName="opacity" from="0" to="1"
      begin=".3s" dur="1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <rect x="60" y="232" width="145" height="32" rx="16"
      fill="#101827" stroke="#245b73"/>
    <text x="81" y="253" class="chip" fill="#7dd3fc">ACCESSIBILITY</text>

    <rect x="216" y="232" width="108" height="32" rx="16"
      fill="#151124" stroke="#5c3b82"/>
    <text x="238" y="253" class="chip" fill="#c084fc">CLEAN UI</text>

    <animate attributeName="opacity" from="0" to="1"
      begin=".45s" dur="1s" fill="freeze"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" keyTimes="0;0.5;1"
      dur="7s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>

    <rect x="30" y="292" width="480" height="98" rx="14"
      fill="#080c18" fill-opacity=".62"
      stroke="#58a6ff" stroke-opacity=".18"/>

    <text x="52" y="326" class="code" fill="#7c8dbb">frontend:</text>
    <text x="148" y="326" class="code" fill="#a855f7">Angular</text>

    <text x="52" y="362" class="code" fill="#7c8dbb">backend:</text>
    <text x="139" y="362" class="code" fill="#a855f7">Django · REST</text>
  </g>
</svg>