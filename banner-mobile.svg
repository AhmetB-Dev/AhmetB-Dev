<svg width="540" height="450" viewBox="0 0 540 450" preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">Animated mobile GitHub profile banner preserving the current design.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="54%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b8cff"/>
    </linearGradient>
    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".32"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#4f8cff" opacity=".45"/>
    </pattern>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="nameReveal">
      <rect x="30" y="40" width="0" height="66"><animate attributeName="width" from="0" to="440" dur=".78s" begin=".18s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/></rect>
    </clipPath>
    <style>
      .name {font-size:54px;font-weight:700;letter-spacing:-1px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .role {font-size:27px;font-weight:700;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .tagline {font-size:19px;font-weight:500;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .chip {font-size:13px;font-weight:700;letter-spacing:.06em;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
      .code {font-size:18px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
    </style>
  </defs>

  <rect width="540" height="450" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="538" height="448" rx="19" fill="none" stroke="#30363d"/>

  <g>
    <circle cx="465" cy="48" r="190" fill="url(#ambientGlow)" filter="url(#blurGlow)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-18 14;0 0" keyTimes="0;.5;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </g>

  <rect x="180" y="12" width="340" height="420" fill="url(#dotPattern)" opacity=".20">
    <animate attributeName="opacity" values=".18;.35;.18" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
<g clip-path="url(#nameReveal)">
    <text x="32" y="92" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
  </g>

  <g opacity="0">
    <text x="34" y="137" class="role" fill="#38bdf8">Fullstack Developer</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.63s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.63s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>
  <g opacity="0">
    <text x="34" y="178" class="tagline" fill="#e5e7eb">Angular · TypeScript · Django · REST APIs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.78s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    
    <rect x="34" y="205" width="145" height="32" rx="16" fill="#101827" stroke="#245b73"/>
    <text x="55" y="226" class="chip" fill="#7dd3fc">ACCESSIBILITY</text>
    <rect x="190" y="205" width="108" height="32" rx="16" fill="#151124" stroke="#5c3b82"/>
    <text x="212" y="226" class="chip" fill="#c084fc">CLEAN UI</text>
  
    <animate attributeName="opacity" from="0" to="1" begin="0.92s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.92s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".58s" dur=".55s" fill="freeze"/>
    <!-- One-time entrance: the intro movement never restarts. -->
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin=".58s" dur=".75s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
    <g>
      <!-- After the intro, the code box only floats vertically in a seamless loop. -->
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 -4;0 0" keyTimes="0;.30;.72;1" begin="1.55s" dur="6.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <rect x="30" y="256" width="480" height="174" rx="14"
      fill="#080c18" fill-opacity=".62" stroke="#58a6ff" stroke-opacity=".18"/>
    <text x="52" y="283" class="code" fill="#38bdf8">const</text>
    <text x="108" y="283" class="code" fill="#7c8dbb">developer = &#123;</text>

    <text x="52" y="309" class="code" fill="#7c8dbb">frontend:</text>
    <text x="148" y="309" class="code" fill="#a855f7">"Angular",</text>

    <text x="52" y="335" class="code" fill="#7c8dbb">backend:</text>
    <text x="139" y="335" class="code" fill="#a855f7">"Django",</text>

    <text x="52" y="361" class="code" fill="#7c8dbb">ci_cd:</text>
    <text x="121" y="361" class="code" fill="#a855f7">"GitHub Actions",</text>

    <text x="52" y="387" class="code" fill="#7c8dbb">deploy:</text>
    <text x="130" y="387" class="code" fill="#a855f7">"Docker · Linux"</text>

    <text x="52" y="413" class="code" fill="#7c8dbb">&#125;</text>
    </g>
  </g>
</svg>