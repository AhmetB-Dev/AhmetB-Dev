<svg width="1200" height="240" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ahmet Balci – Fullstack Developer</title>
  <desc id="description">Animated GitHub banner preserving Ahmet Balci's current portfolio design.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="52%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b8cff"/>
    </linearGradient>
    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".30"/>
      <stop offset="46%" stop-color="#38bdf8" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#4f8cff" opacity=".42"/>
    </pattern>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    
    <clipPath id="nameReveal">
      <rect x="36" y="38" width="0" height="66">
        <animate attributeName="width" from="0" to="520" dur=".78s" begin=".18s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
      </rect>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="814" y="22" width="350" height="196" rx="13"/>
    </clipPath>
    <style>
      .name { font-size:58px;font-weight:700;letter-spacing:-1.2px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .role { font-size:24px;font-weight:700;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { font-size:18px;font-weight:500;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .code { font-size:14px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { font-size:12px;font-weight:700;letter-spacing:.06em;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="238" rx="15" fill="none" stroke="#30363d"/>

  
  <g>
    <circle cx="1035" cy="35" r="225" fill="url(#ambientGlow)" filter="url(#blurGlow)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-22 16;0 0" keyTimes="0;.5;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </g>

  <rect x="430" y="12" width="720" height="214" fill="url(#dotPattern)" opacity=".20">
    <animate attributeName="opacity" values=".18;.34;.18" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
<g clip-path="url(#nameReveal)">
    <text x="40" y="90" class="name" fill="url(#nameGradient)">Ahmet Balci</text>
  </g>

  <g opacity="0">
    <text x="42" y="134" class="role" fill="#38bdf8">Fullstack Developer</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.63s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.63s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>
  <g opacity="0">
    <text x="42" y="174" class="tagline" fill="#e5e7eb">Angular · TypeScript · Django · REST APIs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.78s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    
    <rect x="42" y="190" width="132" height="27" rx="13.5" fill="#101827" stroke="#245b73"/>
    <text x="60" y="208" class="chip" fill="#7dd3fc">ACCESSIBILITY</text>
    <rect x="184" y="190" width="94" height="27" rx="13.5" fill="#151124" stroke="#5c3b82"/>
    <text x="203" y="208" class="chip" fill="#c084fc">CLEAN UI</text>
  
    <animate attributeName="opacity" from="0" to="1" begin="0.92s" dur=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" begin="0.92s" dur=".62s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
  </g>

  <g opacity="0">
    
    <animate attributeName="opacity" from="0" to="1" begin=".52s" dur=".55s" fill="freeze"/>
    <!-- One-time entrance: never resets to the right after the intro. -->
    <animateTransform attributeName="transform" type="translate" from="24 0" to="0 0" begin=".52s" dur=".75s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
    <g>
      <!-- After the intro, the code box only floats vertically in a seamless loop. -->
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 -4;0 0" keyTimes="0;.30;.72;1" begin="1.55s" dur="6.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <rect x="814" y="22" width="350" height="196" rx="13"
      fill="#080c18" fill-opacity=".56" stroke="#58a6ff" stroke-opacity=".16"/>
    <text x="840" y="52" class="code" fill="#38bdf8">const</text>
    <text x="898" y="52" class="code" fill="#7c8dbb">developer = &#123;</text>

    <text x="840" y="82" class="code" fill="#7c8dbb">frontend:</text>
    <text x="921" y="82" class="code" fill="#a855f7">"Angular",</text>

    <text x="840" y="112" class="code" fill="#7c8dbb">backend:</text>
    <text x="911" y="112" class="code" fill="#a855f7">"Django",</text>

    <text x="840" y="142" class="code" fill="#7c8dbb">ci_cd:</text>
    <text x="898" y="142" class="code" fill="#a855f7">"GitHub Actions",</text>

    <text x="840" y="172" class="code" fill="#7c8dbb">deploy:</text>
    <text x="902" y="172" class="code" fill="#a855f7">"Docker · Linux"</text>

    <text x="840" y="202" class="code" fill="#7c8dbb">&#125;</text>
    </g>
  </g>
</svg>